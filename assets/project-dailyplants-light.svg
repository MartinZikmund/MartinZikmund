<svg xmlns="http://www.w3.org/2000/svg" width="284" height="132" viewBox="0 0 284 132" role="img" aria-label="Daily Plants: Daily Dozen checklist. Private, no ads, on the Microsoft Store">
<title>Daily Plants: Daily Dozen checklist. Private, no ads, on the Microsoft Store</title>
<style>
text{font-family:'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#1A1A1A}
.d{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.s{fill:#5D5D5D} .c{fill:#8A8A8A} .a{fill:#005FB8} .oa{fill:#FFFFFF}
.sb{font-weight:600}
@keyframes slide{0%{transform:translateX(-160px)}100%{transform:translateX(620px)}}
