<g transform="translate(6 6)"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#107C10"/><stop offset="1" stop-color="#6CCB5F"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="271" height="119" rx="8" fill="#FFFFFF" stroke="#E5E5E5"/>
<rect x="16" y="16" width="44" height="44" rx="8" fill="#4C7A56"/>
<image x="18" y="18" width="40" height="40" href="data:image/svg+xml;base64,"/>
<text x="72" y="36" font-size="16" class="sb">Daily Plants</text>
<text x="72" y="56" font-size="12" class="c">C# · Uno Platform</text>
