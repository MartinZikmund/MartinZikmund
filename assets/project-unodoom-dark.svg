<svg xmlns="http://www.w3.org/2000/svg" width="272" height="120" viewBox="0 0 272 120" role="img" aria-label="UnoDoom: DOOM running on iOS, Android, macOS, Windows, Linux and the web">
<title>UnoDoom: DOOM running on iOS, Android, macOS, Windows, Linux and the web</title>
<style>
text{font-family:'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#FFFFFF}
.d{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.s{fill:#CFCFCF} .c{fill:#9A9A9A} .a{fill:#60CDFF} .oa{fill:#003E5C}
.sb{font-weight:600}
@keyframes slide{0%{transform:translateX(-160px)}100%{transform:translateX(620px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.bar{animation:slide 2.4s cubic-bezier(.4,0,.2,1) infinite}
.caret{animation:blink 1.1s step-end infinite}
@media (prefers-reduced-motion: reduce){.bar,.caret{animation:none}}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C42B1C"/><stop offset="1" stop-color="#6B0F07"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="271" height="119" rx="8" fill="#2D2D2D" stroke="#3B3B3B"/>
<rect x="16" y="16" width="44" height="44" rx="8" fill="url(#g)"/><text x="38" y="46" font-size="22" text-anchor="middle" style="fill:#fff">👾</text>
<text x="72" y="36" font-size="16" class="sb">UnoDoom</text>
<text x="72" y="56" font-size="12" class="c">C# · Uno Platform</text>
<text x="16" y="84" font-size="13" class="s">DOOM running on iOS, Android, macOS,</text>
<text x="16" y="102" font-size="13" class="s">Windows, Linux and the web</text>
</svg>
